<title>生活工作台 · 离线版</title>
<style>
:root{
  --bg:#eef2f9; --card:#ffffff; --ink:#1f2733; --sub:#6b7785;
  --line:#e6ebf2; --accent:#3b82f6; --good:#16a34a; --warn:#f59e0b;
  --shadow:0 6px 20px rgba(31,39,51,.08); --radius:18px;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0f141b; --card:#1a2230; --ink:#e8edf4; --sub:#93a1b3;
    --line:#28323f; --shadow:0 6px 20px rgba(0,0,0,.4); }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--ink);font-size:16px;line-height:1.5;
  -webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;font-size:16px;color:var(--ink);
  background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:64px}
#app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
.hide{display:none!important}
/* home header */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 6px}
.topbar h1{font-size:21px;margin:0;font-weight:800;letter-spacing:.5px}
.topbar .gear{font-size:22px;width:40px;height:40px;border-radius:12px;background:var(--card);
  box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center}
.date-line{padding:0 18px 10px;color:var(--sub);font-size:13px}
.progress-wrap{margin:4px 14px 8px;background:var(--card);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow)}
.progress-top{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--sub)}
.progress-top b{font-size:18px;color:var(--ink)}
.bar{height:10px;background:var(--line);border-radius:99px;margin-top:8px;overflow:hidden}
.bar > i{display:block;height:100%;background:linear-gradient(90deg,#6ee7b7,#3b82f6);border-radius:99px;transition:width .4s}
/* grid */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:8px 14px 28px}
.tile{background:var(--card);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);
  position:relative;overflow:hidden;border:1px solid var(--line)}
.tile .ic{width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;
  font-size:22px;margin-bottom:10px}
.tile .nm{font-weight:700;font-size:15px}
.tile .meta{font-size:12px;color:var(--sub);margin-top:4px;min-height:16px}
.tile .done{position:absolute;top:10px;right:10px;font-size:18px}
.tile .streak{display:inline-block;margin-top:6px;font-size:11px;color:var(--sub);
  background:var(--bg);border-radius:99px;padding:2px 8px}
/* detail */
#detail{flex:1;display:flex;flex-direction:column;min-height:0}
.detail-head{display:flex;align-items:center;gap:8px;padding:14px 14px 8px}
.detail-head .back{font-size:17px;font-weight:600;padding:8px 10px 8px 4px;color:var(--accent)}
.detail-head .dt{font-size:18px;font-weight:800}
.detail-body{flex:1;overflow-y:auto;padding:6px 14px 30px;-webkit-overflow-scrolling:touch}
.ckbar{display:flex;align-items:center;justify-content:space-between;background:var(--card);
  border-radius:16px;padding:12px 14px;box-shadow:var(--shadow);margin-bottom:14px;border:1px solid var(--line)}
.ckbar .st{font-size:13px;color:var(--sub)}
.ckbtn{padding:9px 16px;border-radius:12px;font-weight:700;font-size:14px;background:var(--accent);color:#fff}
.ckbtn.on{background:var(--good)}
.sec{background:var(--card);border-radius:16px;padding:14px;box-shadow:var(--shadow);margin-bottom:14px;border:1px solid var(--line)}
.sec h3{margin:0 0 10px;font-size:15px;display:flex;align-items:center;gap:6px}
.field{margin-bottom:10px}
.field label{display:block;font-size:12px;color:var(--sub);margin-bottom:4px}
.row{display:flex;gap:10px}
.row > *{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 14px;border-radius:12px;
  background:var(--accent);color:#fff;font-weight:700;font-size:15px;width:100%}
.btn.ghost{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:8px 12px;font-size:13px;width:auto}
.list{margin-top:6px}
.item{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:none}
.item .dot{width:8px;height:8px;border-radius:99px;background:var(--accent);margin-top:7px;flex:none}
.item .body{flex:1;min-width:0}
.item .t{font-weight:600;font-size:14px;word-break:break-word}
.item .s{font-size:12px;color:var(--sub);margin-top:2px;word-break:break-word}
.item .dd{font-size:11px;color:var(--sub);white-space:nowrap}
.item .del{color:var(--sub);font-size:18px;padding:0 4px}
.empty{color:var(--sub);font-size:13px;text-align:center;padding:18px 0}
.stat{display:flex;gap:10px;margin-bottom:12px}
.stat .box{flex:1;background:var(--bg);border-radius:14px;padding:12px;text-align:center}
.stat .box b{display:block;font-size:22px}
.stat .box span{font-size:11px;color:var(--sub)}
.tabs{display:flex;gap:8px;background:var(--bg);border-radius:14px;padding:4px;margin-bottom:14px}
.tabs button{flex:1;padding:9px 0;border-radius:11px;font-weight:700;font-size:13px;color:var(--sub)}
.tabs button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.card-flip{background:linear-gradient(135deg,#6ee7b7,#3b82f6);border-radius:20px;color:#fff;
  padding:30px 20px;min-height:230px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;box-shadow:var(--shadow);user-select:none}
.card-flip .big{font-size:46px;font-weight:800;letter-spacing:1px}
.card-flip .pic{font-size:60px;margin-bottom:6px}
.card-flip .hint{font-size:12px;opacity:.85;margin-top:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{padding:7px 12px;border-radius:99px;background:var(--bg);font-size:13px;border:1px solid var(--line)}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.trip{border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px;background:var(--bg)}
.trip.done{border-color:var(--good)}
.trip .th{display:flex;justify-content:space-between;align-items:center;gap:8px}
.trip .th .tt{font-weight:700}
.cb{display:flex;align-items:center;gap:8px;padding:7px 0}
.cb input{width:18px;height:18px;flex:none}
.quiz-fb{text-align:center;font-weight:800;margin-top:10px;min-height:22px}
.quiz-fb.ok{color:var(--good)} .quiz-fb.no{color:#ef4444}
canvas{max-width:100%}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:rgba(31,39,51,.92);
  color:#fff;padding:10px 18px;border-radius:99px;font-size:14px;opacity:0;transition:.3s;z-index:50;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--card);width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:18px 18px 28px;
  padding-bottom:calc(28px + env(safe-area-inset-bottom))}
.modal h3{margin:4px 0 14px;font-size:17px}
.modal .row{margin-bottom:10px}
</style>
</head>
<body>
<div id="app">
  <section id="home">
    <div class="topbar">
      <h1>🌿 生活工作台</h1>
      <div style="display:flex;gap:8px">
        <button class="gear" id="helpBtn" title="安装指引">❓</button>
        <button class="gear" id="gearBtn" title="设置">⚙️</button>
      </div>
    </div>
    <div class="date-line" id="dateLine"></div>
    <div class="progress-wrap">
      <div class="progress-top"><span>今日打卡进度</span><span><b id="pNum">0</b> / <span id="pTot">10</span></span></div>
      <div class="bar"><i id="pBar" style="width:0%"></i></div>
    </div>
    <div class="grid" id="grid"></div>
  </section>

  <section id="detail" class="hide">
    <div class="detail-head">
      <button class="back" id="backBtn">‹ 返回</button>
      <div class="dt" id="detailTitle"></div>
    </div>
    <div class="detail-body">
      <div class="ckbar" id="ckbar"></div>
      <div id="moduleBody"></div>
    </div>
  </section>
</div>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* ---------- 数据层 ---------- */
const DB={
  get(k,d){try{const v=localStorage.getItem('wb:'+k);return v==null?d:JSON.parse(v);}catch(e){return d;}},
  set(k,v){localStorage.setItem('wb:'+k,JSON.stringify(v));},
  del(k){localStorage.removeItem('wb:'+k);},
  all(){const o={};for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.indexOf('wb:')===0)o[k]=localStorage.getItem(k);}return o;}
};
const recs=(id)=>DB.get('rec:'+id,[]);
const setRecs=(id,a)=>DB.set('rec:'+id,a);
const addRec=(id,r)=>{const a=recs(id);a.push(r);setRecs(id,a);markCk(id,r.date);};
const delRec=(id,idx)=>{const a=recs(id);a.splice(idx,1);setRecs(id,a);};
const ckMap=(id)=>DB.get('ck:'+id,{});
const markCk=(id,d)=>{const m=ckMap(id);m[d]=true;DB.set('ck:'+id,m);};
const toggleCk=(id,d)=>{const m=ckMap(id);if(m[d])delete m[d];else m[d]=true;DB.set('ck:'+id,m);return !!m[d];};
/* ---------- 日期 ---------- */
const pad=n=>(''+n).padStart(2,'0');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());};
const fmt=d=>{const p=d.split('-');return p[1]+'/'+p[2];};
const parse=d=>{const p=d.split('-');return new Date(+p[0],+p[1]-1,+p[2]);};
const diffDays=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
const addDays=(d,n)=>{const x=parse(d);x.setDate(x.getDate()+n);return x.getFullYear()+'-'+pad(x.getMonth()+1)+'-'+pad(x.getDate());};
const WK=['日','一','二','三','四','五','六'];
const pretty=d=>{const x=parse(d);return (x.getMonth()+1)+'月'+x.getDate()+'日 周'+WK[x.getDay()];};
/* ---------- 通用 ---------- */
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1600);}
function esc(s){return (''+s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function checkedToday(id){const t=today();return !!ckMap(id)[t]||recs(id).some(r=>r.date===t);}
function streakOf(id){let n=0;let d=today();const cm=ckMap(id);const rs=recs(id);for(let i=0;i<400;i++){const ok=cm[d]||rs.some(r=>r.date===d);if(ok)n++;else if(i>0)break;d=addDays(d,-1);}return n;}
/* ---------- 视图切换 ---------- */
function showView(v){document.getElementById('home').classList.toggle('hide',v!=='home');document.getElementById('detail').classList.toggle('hide',v!=='detail');window.scrollTo(0,0);}
/* ---------- 模块定义 ---------- */
const MODULES=[
 {id:'english',name:'英语学习',icon:'🇬🇧',color:'#3b82f6',desc:'每日学一点',
  render(b){const t=today();
   b.innerHTML=`
   <div class="sec"><h3>📝 今日学习打卡</h3>
     <div class="field"><label>学习内容（单词 / 句子 / 课程）</label><input id="e_c" placeholder="如：新概念第5课 / 背20个单词"></div>
     <div class="row">
       <div class="field"><label>时长（分钟）</label><input id="e_m" type="number" inputmode="numeric" placeholder="30"></div>
       <div class="field"><label>掌握程度</label><select id="e_l"><option>入门</option><option>熟悉</option><option>熟练</option><option>精通</option></select></div>
     </div>
     <button class="btn" id="e_add">保存并打卡</button>
   </div>
   <div class="sec"><h3>📚 学习记录</h3><div class="list" id="e_list"></div></div>`;
   const list=()=>{const a=recs('english').slice().reverse();const el=b.querySelector('#e_list');
     if(!a.length){el.innerHTML='<div class="empty">还没有记录，今天开始第一笔吧 ✍️</div>';return;}
     el.innerHTML=a.map((r,i)=>`<div class="item"><span class="dot"></span><div class="body"><div class="t">${esc(r.content||'学习')} · ${esc(r.level||'')}</div><div class="s">${r.min?r.min+' 分钟':''}</div></div><span class="dd">${fmt(r.date)}</span><button class="del" data-i="${i}">🗑</button></div>`).join('');
     el.querySelectorAll('.del').forEach(x=>x.onclick=()=>{delRec('english',a.length-1-(+x.dataset.i));refresh('english');toast('已删除');});};
   list();
   b.querySelector('#e_add').onclick=()=>{const c=b.querySelector('#e_c').value.trim();if(!c){toast('请填写学习内容');return;}
     addRec('english',{date:t,content:c,min:b.querySelector('#e_m').value,level:b.querySelector('#e_l').value});refresh('english');toast('打卡成功 🎉');};
  }},
 {id:'reading',name:'阅读打卡',icon:'📖',color:'#8b5cf6',desc:'与收获',
  render(b){const t=today();
   b.innerHTML=`
   <div class="sec"><h3>📖 阅读打卡</h3>
     <div class="field"><label>书名</label><input id="r_b" placeholder="如：《活着》"></div>
     <div class="row">
       <div class="field"><label>页数 / 分钟</label><input id="r_p" placeholder="30"></div>
       <div class="field"><label>评分</label><select id="r_s"><option>★</option><option>★★</option><option>★★★</option><option>★★★★</option><option>★★★★★</option></select></div>
     </div>
     <div class="field"><label>我的收获</label><textarea id="r_n" placeholder="今天读到了什么有意思的？"></textarea></div>
     <button class="btn" id="r_add">保存并打卡</button>
   </div>
   <div class="sec"><h3>💡 阅读收获墙</h3><div class="list" id="r_list"></div></div>`;
   const list=()=>{const a=recs('reading').slice().reverse();const el=b.querySelector('#r_list');
     if(!a.length){el.innerHTML='<div class="empty">还没有阅读记录 📚</div>';return;}
     el.innerHTML=a.map((r,i)=>`<div class="item"><span class="dot"></span><div class="body"><div class="t">${esc(r.book||'阅读')} ${esc(r.star||'')}</div><div class="s">${esc(r.note||'')}${r.page?' · '+esc(r.page):''}</div></div><span class="dd">${fmt(r.date)}</span><button class="del" data-i="${i}">🗑</button></div>`).join('');
     el.querySelectorAll('.del').forEach(x=>x.onclick=()=>{delRec('reading',a.length-1-(+x.dataset.i));refresh('reading');toast('已删除');});};
   list();
   b.querySelector('#r_add').onclick=()=>{const bk=b.querySelector('#r_b').value.trim();if(!bk){toast('请填写书名');return;}
     addRec('reading',{date:t,book:bk,page:b.querySelector('#r_p').value,star:b.querySelector('#r_s').value,note:b.querySelector('#r_n').value.trim()});refresh('reading');toast('打卡成功 🎉');};
  }},
 {id:'weight',name:'减重记录',icon:'⚖️',color:'#10b981',desc:'体重曲线',
  render(b){const t=today();const a=recs('weight').slice().sort((x,y)=>x.date<y.date?-1:1);
   const last=a.length?a[a.length-1].weight:null;
   const prev=a.length>1?a[a.length-2].weight:null;
   const delta=last!=null&&prev!=null?(last-prev):null;
   b.innerHTML=`
   <div class="stat">
     <div class="box"><b>${last!=null?last:'—'}</b><span>最新体重 kg</span></div>
     <div class="box"><b>${delta!=null?(delta>0?'+':'')+delta.toFixed(1):'—'}</b><span>较上次</span></div>
     <div class="box"><b>${a.length}</b><span>累计记录</span></div>
   </div>
   <div class="sec"><h3>📈 体重变化</h3><canvas id="w_cv" width="440" height="200"></canvas></div>
   <div class="sec"><h3>⚖️ 今日称重</h3>
     <div class="row">
       <div class="field"><label>体重 (kg)</label><input id="w_v" type="number" step="0.1" inputmode="decimal" placeholder="如 58.5"></div>
       <div class="field"><label>日期</label><input id="w_d" type="date" value="${t}"></div>
     </div>
     <div class="field"><label>备注</label><input id="w_n" placeholder="如：断食第3天"></div>
     <button class="btn" id="w_add">记录并打卡</button>
   </div>
   <div class="sec"><h3>📋 历史</h3><div class="list" id="w_list"></div></div>`;
   drawWeight(b.querySelector('#w_cv'),a);
   const list=()=>{const el=b.querySelector('#w_list');if(!a.length){el.innerHTML='<div class="empty">还没有称重记录</div>';return;}
     const rev=a.slice().reverse();
     el.innerHTML=rev.map((r,i)=>`<div class="item"><span class="dot"></span><div class="body"><div class="t">${r.weight} kg</div><div class="s">${esc(r.note||'')}</div></div><span class="dd">${fmt(r.date)}</span><button class="del" data-i="${i}">🗑</button></div>`).join('');
     el.querySelectorAll('.del').forEach(x=>x.onclick=()=>{const idx=a.length-1-(+x.dataset.i);delRec('weight',idx);refresh('weight');toast('已删除');});};
   list();
   b.querySelector('#w_add').onclick=()=>{const v=parseFloat(b.querySelector('#w_v').value);if(!v){toast('请输入体重');return;}
     addRec('weight',{date:b.querySelector('#w_d').value||t,weight:v,note:b.querySelector('#w_n').value.trim()});refresh('weight');toast('已记录 🎉');};
  }},
 {id:'period',name:'经期记录',icon:'🩸',color:'#ec4899',desc:'周期预测',
  render(b){const t=today();const days=recs('period').filter(r=>r.type==='start').map(r=>r.date).sort();
   const cyc=DB.get('cfg:period_cycle',28);const plen=DB.get('cfg:period_len',5);
   let info='';
   if(days.length){const last=days[days.length-1];const avg=days.length>1?Math.round((parse(last)-parse(days[0]))/(days.length-1)/864e5):cyc;
     const next=addDays(last,avg);const cd=diffDays(t,next);const inCycle=diffDays(last,t)+1;
     const ongoing=diffDays(last,t)<=plen-1&&diffDays(last,t)>=0;
     info=`<div class="stat">
       <div class="box"><b>${cd>=0?cd:'—'}</b><span>${cd>=0?'距下次 (天)':'已过期'}</span></div>
       <div class="box"><b>${ongoing?'进行中':inCycle}</b><span>${ongoing?'本次经期':'周期第几天'}</span></div>
       <div class="box"><b>${avg}</b><span>平均周期</span></div>
     </div>
     <div class="sec"><h3>🔮 预测</h3><div class="s">上次来潮：<b>${pretty(last)}</b><br>预计下次：<b>${pretty(next)}</b>${ongoing?'<br><span style="color:var(--good)">当前经期进行中 🌸</span>':''}</div></div>`;
   } else {info='<div class="sec"><div class="empty">记录第一次经期开始日，即可预测周期 🌸</div></div>';}
   b.innerHTML=info+`
   <div class="sec"><h3>🩸 记录经期</h3>
     <div class="field"><label>日期（默认为今天）</label><input id="p_d" type="date" value="${t}"></div>
     <div class="row">
       <div class="field"><label>周期长度(天)</label><input id="p_c" type="number" value="${cyc}"></div>
       <div class="field"><label>经期长度(天)</label><input id="p_l" type="number" value="${plen}"></div>
     </div>
     <button class="btn" id="p_add">标记来潮并开始打卡</button>
     ${days.length?'<button class="btn ghost" id="p_undo" style="margin-top:10px">撤销最近一次记录</button>':''}
   </div>
   <div class="sec"><h3>📅 历史</h3><div class="list" id="p_list"></div></div>`;
   const el=b.querySelector('#p_list');
   if(days.length)el.innerHTML=days.slice().reverse().map(d=>`<div class="item"><span class="dot"></span><div class="body"><div class="t">来潮 ${pretty(d)}</div></div><span class="dd">${fmt(d)}</span></div>`).join('');
   else el.innerHTML='<div class="empty">暂无记录</div>';
   b.querySelector('#p_add').onclick=()=>{const d=b.querySelector('#p_d').value||t;DB.set('cfg:period_cycle',+b.querySelector('#p_c').value||28);DB.set('cfg:period_len',+b.querySelector('#p_l').value||5);
     addRec('period',{date:d,type:'start'});refresh('period');toast('已记录 🌸');};
   const undo=b.querySelector('#p_undo');if(undo)undo.onclick=()=>{const a=recs('period');let idx=-1;for(let i=a.length-1;i>=0;i--)if(a[i].type==='start'){idx=i;break;}if(idx>=0){delRec('period',idx);refresh('period');toast('已撤销');}};
  }},
 {id:'mood',name:'心情日记',icon:'🌈',color:'#f59e0b',desc:'今天心情',
  render(b){const t=today();const moods=[['😄','很开心'],['🙂','还不错'],['😐','一般'],['😟','有点丧'],['😢','难过'],['😡','生气']];
   b.innerHTML=`
   <div class="sec"><h3>🌈 今日心情</h3>
     <div class="chips" id="m_moods">${moods.map(m=>`<button class="chip" data-m="${m[0]}" data-t="${m[1]}">${m[0]} ${m[1]}</button>`).join('')}</div>
     <div class="field" style="margin-top:12px"><label>想说点什么</label><textarea id="m_n" placeholder="今天发生了什么？"></textarea></div>
     <button class="btn" id="m_add">记下心情并打卡</button>
   </div>
   <div class="sec"><h3>📔 最近心情</h3><div class="list" id="m_list"></div></div>`;
   let sel='';
   b.querySelectorAll('#m_moods .chip').forEach(c=>c.onclick=()=>{sel=c.dataset.m+' '+c.dataset.t;b.querySelectorAll('#m_moods .chip').forEach(x=>x.classList.remove('on'));c.classList.add('on');});
   const list=()=>{const a=recs('mood').slice().reverse();const el=b.querySelector('#m_list');
     if(!a.length){el.innerHTML='<div class="empty">还没有心情记录 🌤</div>';return;}
     el.innerHTML=a.map((r,i)=>`<div class="item"><span class="dot"></span><div class="body"><div class="t">${esc(r.mood||'')}</div><div class="s">${esc(r.note||'')}</div></div><span class="dd">${fmt(r.date)}</span><button class="del" data-i="${i}">🗑</button></div>`).join('');
     el.querySelectorAll('.del').forEach(x=>x.onclick=()=>{delRec('mood',a.length-1-(+x.dataset.i));refresh('mood');toast('已删除');});};
   list();
   b.querySelector('#m_add').onclick=()=>{if(!sel){toast('请先选择心情');return;}addRec('mood',{date:t,mood:sel,note:b.querySelector('#m_n').value.trim()});refresh('mood');toast('已记录 💛');};
  }},
 {id:'expense',name:'每日记账',icon:'💰',color:'#ef4444',desc:'花销明细',
  render(b){const t=today();const a=recs('expense');const month=a.filter(r=>r.date.slice(0,7)===t.slice(0,7));
   const todaySum=a.filter(r=>r.date===t).reduce((s,r)=>s+(+r.amount||0),0);
   const monthSum=month.reduce((s,r)=>s+(+r.amount||0),0);
   b.innerHTML=`
   <div class="stat">
     <div class="box"><b>${todaySum.toFixed(0)}</b><span>今日支出</span></div>
     <div class="box"><b>${monthSum.toFixed(0)}</b><span>本月支出</span></div>
     <div class="box"><b>${a.length}</b><span>总笔数</span></div>
   </div>
   <div class="sec"><h3>💸 记一笔</h3>
     <div class="row">
       <div class="field"><label>金额</label><input id="x_a" type="number" step="0.01" inputmode="decimal" placeholder="0.00"></div>

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function flashCard(eb,data,frontKey,picKey,backKey,revealLabel){
  let order=shuffle(data);let i=0;let reveal=false;
  const card=()=>{const it=order[i];
    eb.innerHTML=`<div class="card-flip" id="fc">
        ${picKey?`<div class="pic">${it[picKey]}</div>`:''}
        <div class="big">${reveal?it[backKey]:it[frontKey]}</div>
        <div class="hint">${reveal?('点击切换下一张 · '+revealLabel):'点击卡片查看答案'}</div>
      </div>
      <div class="row" style="margin-top:12px">
        <button class="btn ghost sm" id="prev">‹ 上一张</button>
        <button class="btn ghost sm" id="rnd">🎲 随机</button>
        <button class="btn ghost sm" id="next">下一张 ›</button>
      </div>
      <div class="s" style="text-align:center;color:var(--sub);margin-top:8px">第 ${i+1} / ${order.length} 张</div>`;
    eb.querySelector('#fc').onclick=()=>{reveal=!reveal;card();};
    eb.querySelector('#prev').onclick=()=>{i=(i-1+order.length)%order.length;reveal=false;card();};
    eb.querySelector('#next').onclick=()=>{i=(i+1)%order.length;reveal=false;card();};
    eb.querySelector('#rnd').onclick=()=>{i=Math.floor(Math.random()*order.length);reveal=false;card();};
  };
  card();
}

/* ---------- 体重图表 ---------- */
function drawWeight(cv,a){const ctx=cv.getContext('2d');const W=cv.width,H=cv.height;ctx.clearRect(0,0,W,H);
  if(a.length<1){ctx.fillStyle='#9aa5b1';ctx.font='14px sans-serif';ctx.textAlign='center';ctx.fillText(a.length?'至少需要2个数据点':'暂无数据',W/2,H/2);return;}
  const vals=a.map(r=>+r.weight);const min=Math.min(...vals),max=Math.max(...vals);const pad=(max-min)*0.15||1;const lo=min-pad,hi=max+pad;
  const dark=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches;
  const grid=dark?'#28323f':'#e6ebf2';const ink=dark?'#e8edf4':'#1f2733';
  const X=i=>40+(W-60)*(a.length===1?0.5:i/(a.length-1));
  const Y=v=>20+(H-50)*(1-(v-lo)/(hi-lo));
  ctx.strokeStyle=grid;ctx.lineWidth=1;for(let k=0;k<=3;k++){const y=20+(H-50)*k/3;ctx.beginPath();ctx.moveTo(40,y);ctx.lineTo(W-20,y);ctx.stroke();
    ctx.fillStyle=ink;ctx.font='10px sans-serif';ctx.textAlign='right';ctx.fillText((hi-(hi-lo)*k/3).toFixed(1),36,y+3);}
  ctx.strokeStyle='#10b981';ctx.lineWidth=2.5;ctx.beginPath();a.forEach((r,i)=>{const x=X(i),y=Y(+r.weight);i?ctx.lineTo(x,y):ctx.moveTo(x,y);});ctx.stroke();
  a.forEach((r,i)=>{const x=X(i),y=Y(+r.weight);ctx.fillStyle='#10b981';ctx.beginPath();ctx.arc(x,y,3.5,0,7);ctx.fill();});
  ctx.fillStyle=ink;ctx.font='10px sans-serif';ctx.textAlign='center';a.forEach((r,i)=>{if(i%Math.ceil(a.length/6)===0||i===a.length-1)ctx.fillText(fmt(r.date),X(i),H-6);});
}
